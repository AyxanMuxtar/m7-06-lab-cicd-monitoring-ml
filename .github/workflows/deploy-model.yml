name: Deploy Vision Moderation Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: "" # Placeholder to suppress IDE warnings; populated dynamically in jobs
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Stage 1: Lint ──────────────────────────────────────────────
  lint:
    name: Lint specs & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint OpenAPI spec
        run: |
          npm install -g @stoplight/spectral-cli
          spectral lint openapi.yaml --fail-severity error

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  # ── Stage 2: Test ──────────────────────────────────────────────
  test:
    name: Unit & contract tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit tests
        run: bash ./scripts/test-unit.sh

      - name: Run contract tests
        run: bash ./scripts/test-contract.sh

  # ── Stage 3: Build ────────────────────────────────────────────
  build:
    name: Build container image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image as artifact
        run: docker save ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: image.tar
          retention-days: 1

  # ── Stage 4: Scan ─────────────────────────────────────────────
  scan:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  # ── Stage 5: Push ─────────────────────────────────────────────
  push:
    name: Push image to GHCR
    runs-on: ubuntu-latest
    needs: [scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: container-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

  # ── Stage 6: Deploy Staging ───────────────────────────────────
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy to staging
        run: bash ./scripts/deploy.sh staging ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

  # ── Stage 7: Smoke Staging ───────────────────────────────────
  smoke-staging:
    name: Smoke-test staging
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: bash ./scripts/smoke.sh staging

  # ── Stage 8: Deploy Production (canary) ──────────────────────
  deploy-production:
    name: Deploy to production (canary → full)
    runs-on: ubuntu-latest
    needs: [smoke-staging]
    environment: production          # requires manual approval
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Canary deploy at 10 %
        run: bash ./scripts/deploy.sh production ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} --canary 10

      - name: Verify canary
        run: bash ./scripts/canary-verify.sh production

      - name: Full rollout
        run: bash ./scripts/deploy.sh production ${{ env.IMAGE }}:${{ env.IMAGE_TAG }} --canary 100
