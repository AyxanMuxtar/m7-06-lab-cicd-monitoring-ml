openapi: "3.0.3"
info:
  title: Vision Moderation API
  description: >-
    Content moderation service that classifies images for policy violations
    using a computer-vision model.
  version: "1.0.0"
  contact:
    name: ML Platform Team

servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://staging-api.example.com/v1
    description: Staging

paths:
  /moderate:
    post:
      operationId: moderateImage
      summary: Classify an image for policy violations
      tags:
        - Moderation
      description: >-
        Accepts an image (URL or base64) and returns moderation labels
        with confidence scores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationRequest"
      responses:
        "200":
          description: Moderation result returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationResponse"
          headers:
            X-Model-Version:
              description: The model version that produced this result
              schema:
                type: string
        "400":
          description: Invalid request (e.g. missing image)
        "500":
          description: Internal server error

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns 200 if the service is healthy and ready to serve traffic.
      tags:
        - Infrastructure
      responses:
        "200":
          description: Service is healthy

components:
  schemas:
    ModerationRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          description: Image URL or base64-encoded image data
        callback_url:
          type: string
          format: uri
          description: Optional webhook URL for async results

    ModerationResponse:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        labels:
          type: array
          items:
            $ref: "#/components/schemas/ModerationLabel"
        model_version:
          type: string

    ModerationLabel:
      type: object
      properties:
        category:
          type: string
          enum:
            - safe
            - violence
            - nudity
            - hate_speech
            - self_harm
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
